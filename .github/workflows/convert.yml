name: MEG to Bedrock Converter
run-name: MEG conversion ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Temporary HTTPS download link for ZIP containing .bbmodel files'
        required: true
        type: string
      request_id:
        description: 'Conversion request identifier'
        required: true
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download ZIP File
        run: wget --https-only --timeout=60 --tries=3 -O input.zip "${{ inputs.zip_url }}" || { echo "Download failed. Check the temporary URL."; exit 1; }

      - name: Validate request input
        run: |
          test -n "${{ inputs.request_id }}"
          file input.zip || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
        
      - name: Run Converter Script
        run: node convert.js
        
      - name: Upload Final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-GeyserMC-Output
          path: meg-bedrock.zip
          retention-days: 1
          if-no-files-found: error
